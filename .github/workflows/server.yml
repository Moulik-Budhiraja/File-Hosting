name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
      - "cli/**"
      - "compose.yaml"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tests/**"
      - "cli/**"
      - "compose.yaml"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  server:
    name: Lint, test, build, production browser tests
    runs-on: ubuntu-latest
    env:
      FS_TOKEN: ci-synthetic-service-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            cli/package-lock.json
      - name: Verify production lockfile integrity
        run: node --test tests/lockfile.test.mjs
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Enable and verify the Linux process sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node server/runtime/verify-linux-sandbox.js
      - name: Lint
        working-directory: server
        run: npm run lint
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Backend tests
        working-directory: server
        run: npm test
      - name: Frontend unit tests
        working-directory: server
        run: npm run test:ui
      - name: Format check
        working-directory: server
        run: npm run format:check
      - name: Production build (includes standalone packaging)
        working-directory: server
        run: npm run build
      - name: Standalone asset smoke check
        working-directory: server
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
      - name: Install Playwright Chromium
        working-directory: server
        run: npx playwright install --with-deps chromium
      - name: Production browser tests (standalone server)
        working-directory: server
        run: npm run test:e2e
      - name: Build CLI for root E2E
        working-directory: cli
        run: npm ci && npm run build
      - name: Root end-to-end tests
        run: node --test tests/compose.test.mjs tests/e2e.test.mjs tests/lockfile.test.mjs
      - name: Production dependency audit
        working-directory: server
        run: npm audit --omit=dev

  container:
    name: Docker build and Compose runtime smoke
    runs-on: ubuntu-latest
    env:
      FS_TOKEN: ci-synthetic-service-token
      FS_BOOTSTRAP_USERNAME: ci-admin
      FS_BOOTSTRAP_PASSWORD: ci-bootstrap-password-2026
      FS_PUBLIC_URL: http://127.0.0.1:37641
      FS_MIN_FREE_BYTES: 1
    steps:
      - uses: actions/checkout@v4
      - name: Compose static test
        run: node --test tests/compose.test.mjs
      - name: Build and smoke Compose runtime
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --volumes --remove-orphans || true
            docker network rm nginx-proxy_default || true
          }
          trap cleanup EXIT
          sudo install -d -m 700 -o 1001 -g 1001 runtime/files runtime/sqlite
          docker network create nginx-proxy_default
          docker compose build --pull
          docker compose up --detach --wait
          curl --fail --silent --show-error http://127.0.0.1:37641/healthz
          curl --fail --silent --show-error --cookie-jar /tmp/fs-cookies \
            -H 'content-type: application/json' \
            -H 'origin: http://127.0.0.1:37641' \
            --data '{"username":"ci-admin","password":"ci-bootstrap-password-2026"}' \
            http://127.0.0.1:37641/api/auth/login
          curl --fail --silent --show-error --cookie /tmp/fs-cookies \
            http://127.0.0.1:37641/api/auth/me
          upload="$(curl --fail --silent --show-error --cookie /tmp/fs-cookies \
            -H 'content-type: text/plain' \
            -H 'origin: http://127.0.0.1:37641' \
            --data-binary 'compose-smoke' \
            'http://127.0.0.1:37641/api/files?name=compose-smoke.txt')"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.name!=="compose-smoke.txt") process.exit(1)' "$upload"
