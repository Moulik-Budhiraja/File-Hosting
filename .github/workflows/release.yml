name: Release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            cli/package-lock.json
      - name: Verify Docker Compose
        run: docker compose version
      - name: Install Chromium and the Linux process sandbox
        run: sudo apt-get update && sudo apt-get install -y chromium bubblewrap
      - name: Enable and verify the Linux process sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap \
            --die-with-parent \
            --unshare-all \
            --new-session \
            --ro-bind /usr /usr \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind "$PWD" "$PWD" \
            --bind /tmp /tmp \
            --dev /dev \
            --proc /proc \
            --chdir "$PWD" \
            -- /usr/bin/true
      - name: Run canonical release gate
        run: ./scripts/release-check.sh
